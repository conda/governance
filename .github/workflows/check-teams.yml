name: Teams
on:
  workflow_dispatch:
  pull_request_target: # zizmor: ignore[dangerous-triggers] intentional: fork PRs need access to CONDA_ORG_WIDE_* secrets to validate teams
    paths:
      - teams/*.yml
      - teams/*.yaml
      - teams/*.schema.json
      - scripts/schemas.py
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
      - run: pixi run check_teams
        env:
          CONDA_ORG_WIDE_TOKEN: ${{ secrets.CONDA_ORG_WIDE_READ_ONLY }}
          CONDA_INCUBATOR_ORG_WIDE_TOKEN: ${{ secrets.CONDA_INCUBATOR_ORG_WIDE_READ_ONLY }}
