name: Check teams
description: 'Org-wide audits of team composition, owned repositories, permissions and other details'
inputs:
  organizations:
    required: true
    description: space-separated list of organizations to check
  exclude-checks:
    required: false
    default: ""
    description: comma-separated list of optional checks to skip, or 'all'
  tokens-per-organization:
    required: true
    description: JSON object mapping organization names to GitHub tokens
runs:
  using: composite
  steps:
    - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
    - name: Check teams for ${{ inputs.organizations }}
      env:
        PYTHONUNBUFFERED: "1"
        ORGANIZATIONS: ${{ inputs.organizations }}
        EXCLUDE_CHECKS: ${{ inputs.exclude-checks }}
        GITHUB_TOKENS_PER_ORG: ${{ inputs.tokens-per-organization }}
      shell: bash
      run: |
        read -ra orgs <<< "$ORGANIZATIONS"
        args=()
        if [[ -n "$EXCLUDE_CHECKS" ]]; then args+=(-x "$EXCLUDE_CHECKS"); fi
        pixi run check_teams "${args[@]}" "${orgs[@]}"
